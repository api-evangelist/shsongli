description: 'shsongli (Shanghai Pine & Power / Songli Biotech Co., Ltd.) is a Shanghai-based
  biotechnology and medical-device maker specializing in the R&D, manufacture and sale of
  biological hemostatic products, most notably animal-derived quick-dissolving fibrin glue
  with independent IP, used in surgery and expanding into tissue engineering. The company
  operates a Class III medical-device line and is ISO 13485 and GMP certified. Surfaced as a
  portfolio company of the venture firm qiming and added to the API Evangelist network. The
  enrichment pass found no public developer or API surface: the shsongli.com domain returns
  404 on every path (EIMS web server) with an expired TLS certificate, and no docs, portal,
  packages, MCP, llms.txt, /.well-known/ endpoints, or security program were published.'
